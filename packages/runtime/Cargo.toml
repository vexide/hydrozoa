[package]
name = "runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hydrozoa"

# These fields configure default behavior for uploads with `cargo v5`.
[package.metadata.v5]
slot = 1
icon = "cool-x"
compress = true

[dependencies]
vexide.workspace = true
vex-sdk.workspace = true
vexide_wasm_startup = { version = "0.1.0", path = "../startup" }
hashbrown = "0.15.1"
printf-compat = { version = "0.1.1", default-features = false }
bytemuck = "1.19.0"
anyhow = { version = "1.0.93", default-features = false }
wamr-rust-sdk = { git = "https://github.com/doinkythederp/wamr-rust-sdk.git", branch = "feat/vexos-target", default-features = false }